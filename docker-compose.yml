version: '3.8'

services:
  web:
    build: .
    container_name: apache_php_app
    ports:
      -"8080:80"
    volumes:
      -./php:/var/www/html
    depends_on:
      -db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db
      MYSQL_USER: student
      MYSQL_PASSWORD:123
    ports:
      - "3306:3306"
    volumes:
      -db_data:/var/lib/mysql
      - ./mysql/init.sql:docker-entrypoint-initdb.b/init.sql

volumes:
  db_data:
